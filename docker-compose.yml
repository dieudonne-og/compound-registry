services:
  db:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: compound_registry
      MYSQL_USER: cr
      MYSQL_PASSWORD: ${DB_PASSWORD:-cr_dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_password}
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      retries: 20

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: mysql://cr:${DB_PASSWORD:-cr_dev_password}@db:3306/compound_registry
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AUDIT_SECRET: ${AUDIT_SECRET:?set AUDIT_SECRET in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Kigali}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-Demo!2026}
    volumes: [uploads:/data/storage]

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  db-data:
  uploads:
