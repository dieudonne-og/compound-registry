services:
  db:
    restart: unless-stopped
    image: mysql:8.4
    command: ['--log-bin-trust-function-creators=1']
    environment:
      MYSQL_DATABASE: compound_registry
      MYSQL_USER: cr
      MYSQL_PASSWORD: ${DB_PASSWORD:-cr_dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_password}
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-u',
          'root',
          '-p${DB_ROOT_PASSWORD:-root_dev_password}',
        ]
      interval: 5s
      retries: 20

  api:
    restart: unless-stopped
    build: { context: ., dockerfile: docker/api.Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: mysql://cr:${DB_PASSWORD:-cr_dev_password}@db:3306/compound_registry
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AUDIT_SECRET: ${AUDIT_SECRET:?set AUDIT_SECRET in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Kigali}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      SEED_DEMO: ${SEED_DEMO:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRUST_PROXY: 1
      # Plain HTTP on localhost; set to true when served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-2}
      SEED_PASSWORD: ${SEED_PASSWORD:-Demo!2026}
    volumes: [uploads:/data/storage]

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_SHOW_DEMO_ACCOUNTS: ${SHOW_DEMO_ACCOUNTS:-true}
        VITE_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
        VITE_APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Kigali}
    depends_on: [api]
    ports: ['8080:80']
    environment:
      # Upload limit plus room for the multipart envelope.
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-12m}

volumes:
  db-data:
  uploads:
